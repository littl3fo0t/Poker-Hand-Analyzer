<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="./custom.css" rel="stylesheet" />
    <script type="module" src="./main.js"></script>
    <title>Vue 3 Poker Hand</title>
</head>

<body>
    <h1 class="text-center mt-5">Let's Play Poker</h1>

    <div id="app" class="container text-center mt-5">

        <div v-if="error" class="alert alert-danger mt-3" role="alert">
            {{ error }}
        </div>

        <div v-if="!cards || cards.length === 0">
            <h3 class="mb-4">Start a New Game</h3>
            <button v-if="deckId" @click="startGame" class="btn btn-lg btn-success mt-3">
                Draw 5 New Cards
            </button>
            <p v-else class="lead mt-5">Shuffling a new deck...</p>
        </div>

        <div v-if="cards && cards.length > 0">

            <h3 class="mt-3 mb-4">Your Hand</h3>

            <div class="d-flex flex-row flex-nowrap justify-content-evenly card-hand-container">
                <div v-for="card in cards" :key="card.code" @click="flipCard(card.code)">
                    <img :src="card.flipped ? flippedCardUrl : card.image" :title="`${card.value} of ${card.suit}`">
                </div>
            </div>

            <div class="row mb-4">
                <div class="col-12">
                    <p class="lead mb-1">Swaps Remaining:
                        <strong>{{ swaps }}</strong>
                    </p>
                    <p class="lead">Best Hand:
                        <strong>{{ handRank }}</strong>
                    </p>
                </div>
            </div>

            <button v-if="canSwap" @click="performSwap" :disabled="!cardsSelectedToSwap"
                class="btn btn-primary btn-lg mt-5">
                Swap Selected Card(s)
            </button>

            <button v-else-if="gameOver" @click="shuffleDeck" class="btn btn-danger btn-lg mt-5">
                Shuffle Deck & Play Again
            </button>

            <p v-if="gameOver" class="text-danger fw-bold mt-3">
                No swaps remaining. Click "Shuffle Deck" to restart.
            </p>

        </div>
    </div>
    <footer class="bg-light text-center text-muted py-4 mt-5">
        <div class="container">
            <p class="lead mb-1 fw-semibold">&copy; 2025 | Thomas Brun</p>

            <div class="d-flex justify-content-center gap-4">
                <a href="https://www.linkedin.com/in/thomasbrun1/" target="_blank" class="text-muted fs-1">
                    <i class="bi bi-linkedin"></i>
                </a>

                <a href="https://github.com/littl3fo0t" target="_blank" class="text-muted fs-1">
                    <i class="bi bi-github"></i>
                </a>

                <a href="mailto:thomas.brun.1703@hotmail.com" class="text-muted fs-1">
                    <i class="bi bi-envelope-fill"></i>
                </a>
            </div>
        </div>
    </footer>
</body>

</html>
